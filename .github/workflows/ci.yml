name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Ambev.DeveloperEvaluation.sln

      - name: Build (warnings as errors)
        run: dotnet build Ambev.DeveloperEvaluation.sln --no-restore -warnaserror

      - name: Run unit tests
        run: >
          dotnet test Ambev.DeveloperEvaluation.sln --no-build
          --filter "FullyQualifiedName!~IntegrationTests"
          --logger "trx;LogFileName=unit-tests.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: backend/TestResults/**

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: backend/TestResults/**/coverage.cobertura.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Ambev.DeveloperEvaluation.sln

      - name: Build
        run: dotnet build Ambev.DeveloperEvaluation.sln --no-restore

      - name: Run integration tests
        run: >
          dotnet test tests/Ambev.DeveloperEvaluation.Api.IntegrationTests/Ambev.DeveloperEvaluation.Api.IntegrationTests.csproj
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Upload integration test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: integration-test-results
          path: backend/TestResults/**

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: ambev-developer-evaluation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
