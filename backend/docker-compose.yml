services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ambev_api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ambev_eval;Username=ambev;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ambev
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__ExpiryMinutes: "60"
      Jwt__RefreshExpiryDays: "7"
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:3000}
      OpenTelemetry__ServiceName: ambev-developer-evaluation
      OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ambev_net

  postgres:
    image: postgres:16-alpine
    container_name: ambev_postgres
    environment:
      POSTGRES_DB: ambev_eval
      POSTGRES_USER: ambev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambev -d ambev_eval"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - ambev_net

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ambev_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ambev
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ambev_net

  redis:
    image: redis:7-alpine
    container_name: ambev_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ambev_net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ambev_otel_collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./docker/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    restart: unless-stopped
    networks:
      - ambev_net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ambev_jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
    restart: unless-stopped
    networks:
      - ambev_net

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  ambev_net:
    driver: bridge
